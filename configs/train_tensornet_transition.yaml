# Excited-state transition charges / transition dipoles (gas phase). See docs/transition-properties.md.
# Dataset: z.npy, pos.npy (angstrom), transition_charges.npy [frames, atoms, n_states] (e),
#          transition_dipole.npy [frames, n_states, 3] (e*angstrom; 1 a.u. = 0.529177 e*angstrom).
# Label signs may be arbitrary per (frame, state): the loss picks the optimal sign per state.
family: tensornet_transition
model_config:
  schema_version: 1
  architecture: tensornet_transition_v1
  precision: 32
  embedding_dimension: 128
  num_layers: 2
  num_rbf: 32
  max_num_neighbors: 64
  cutoff_upper: 5.0
  num_states: 1           # must equal the trailing state axis of the labels
  atomic_dipoles: false   # true: mu = sum q r + sum p_i (when point charges cannot reproduce mu)
  units: {length: angstrom, charge: e, dipole: e*angstrom}
training:
  epochs: 300
  batch_size: 32
  validation_interval: 5
  learning_rate: 0.0005
  dtype: float32
  device: cuda
  # ~1/(expected RMSE)^2: charges ~0.01 e, dipole ~0.05 e*angstrom
  loss_weights: {transition_charges: 10000.0, transition_dipole: 400.0}
  early_stopping: true
  early_stopping_patience: 10
  test_interval: 1000000
train:
  directory: ../data/transition_train
validation:
  directory: ../data/transition_validation
output_dir: ../runs/tensornet_transition
