# Numerical residual prototype. Labels MUST be residuals after consistent
# baseline subtraction. See docs/tensornet-qmmm.md for total-energy offline mode.
family: tensornet_qmmm
model_config:
  schema_version: 1
  precision: 64
  embedding_dimension: 64
  num_layers: 3
  num_rbf: 32
  max_num_neighbors: 64
  cutoff_upper: 5.0
  environment_cutoff: 10.0
  environment_mode: fixed_reference_selection
  potential_scale: 1.0
  field_scale: 1.0
  units: {length: angstrom, energy: eV, charge: e}
  baseline: {mode: residual_only}
training:
  epochs: 10
  batch_size: 1
  learning_rate: 0.001
  dtype: float64
  device: cpu
  loss_weights: {energy: 1.0, forces: 1.0}
  # Optional labels: mm_forces: 1.0, mm_potential: 1.0
train:
  directory: ../data/qmmm_residual_train
  gradients: false
  energy_scale: 1.0
  length_scale: 1.0
output_dir: ../runs/tensornet_qmmm
