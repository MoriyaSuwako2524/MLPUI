[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlpui"
version = "0.1.0"
description = "interface for Machine Learning Potentials"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "moriya2524", email = "suwako2524@gmail.com"}
]
requires-python = ">=3.10"


dependencies = [
    "torch>=2.0.0",
    "pytorch-lightning>=2.0.0",
    "torch_geometric>=2.0.0",
    "numpy>=1.20.0",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
    "ase>=3.22",
    "psutil>=5.9",
    "omegaconf>=2.3",
    "lightning-utilities>=0.10",
]

[project.optional-dependencies]
test = ["pytest>=8"]
les = ["les @ git+https://github.com/ChengUCB/les@35b971a650cf30adb84fef7138761e81aa47b3a2"]

[tool.setuptools.packages.find]
include = ["mlpui*", "scripts*"]

[tool.setuptools.package-data]
"mlpui.web" = ["static/*.html", "static/*.css", "static/*.js"]
"mlpui.models.newtonnet" = ["LICENSE"]
"mlpui.models.torchmdnet" = ["LICENSE", "extensions/*.cpp", "extensions/neighbors/*.cpp", "extensions/neighbors/*.cu", "extensions/neighbors/*.cuh"]
"mlpui.models" = ["VENDORED_MODELS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: runs real optional model backends"]
