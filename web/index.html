<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MLPUI</title>

  <!-- LiteGraph -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/css/litegraph.css" />
  <script src="https://cdn.jsdelivr.net/npm/litegraph.js@0.7.18/build/litegraph.core.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="/web/css/style.css" />
</head>
<body>

<!-- ── Toolbar ────────────────────────────────────────────────────────── -->
<div id="toolbar">
  <span class="logo">MLPUI</span>

  <div class="tab-group">
    <button class="tab-btn active" data-tab="inference">Inference</button>
    <button class="tab-btn"        data-tab="training" >Training</button>
    <button class="tab-btn"        data-tab="dataset"  >Dataset</button>
  </div>

  <div class="sep"></div>
  <button id="btn-queue" class="primary">&#9654; Queue</button>
  <button id="btn-arrange">Auto Arrange</button>
  <button id="btn-clear">Clear</button>
  <span id="status" class="status-text">Loading…</span>
</div>

<!-- ── Inference tab ──────────────────────────────────────────────────── -->
<div id="main" class="tab-panel">

  <!-- Canvas -->
  <div id="canvas-wrap">
    <canvas id="graph-canvas"></canvas>
  </div>

  <!-- Output panel -->
  <div id="output-panel">
    <div class="panel-header">
      <button class="panel-tab active" data-view="result">Result</button>
      <button class="panel-tab"        data-view="history">History</button>
    </div>

    <div id="result-view" class="panel-view">
      <div id="output-content">
        <p class="empty-hint">Right-click canvas to add nodes.<br>Connect them, then click Queue.</p>
      </div>
    </div>

    <div id="history-view" class="panel-view" style="display:none">
      <div id="history-content">
        <p class="empty-hint">No runs yet.</p>
      </div>
    </div>
  </div>

</div>

<!-- ── Training tab (placeholder) ────────────────────────────────────── -->
<div id="training-main" class="tab-panel" style="display:none">
  <div class="coming-soon">
    <div class="coming-soon-icon">&#9881;</div>
    <div class="coming-soon-title">Training</div>
    <div class="coming-soon-body">Fine-tuning interface coming soon.</div>
  </div>
</div>

<!-- ── Dataset tab ─────────────────────────────────────────────────────── -->
<div id="dataset-main" class="tab-panel" style="display:none">

  <!-- Sidebar: dataset list + upload -->
  <div id="ds-sidebar">
    <div class="ds-sidebar-header">
      <span>Datasets</span>
      <label class="ds-upload-label" title="Upload .npz file">
        + Upload
        <input type="file" id="ds-upload-input" accept=".npz" style="display:none" />
      </label>
    </div>
    <div id="ds-list">
      <p class="empty-hint" style="margin-top:20px">No datasets.</p>
    </div>
  </div>

  <!-- Main detail area -->
  <div id="ds-detail">
    <div id="ds-placeholder" class="ds-placeholder" style="display:flex">
      <div class="coming-soon-icon">&#128190;</div>
      <div class="coming-soon-title">No dataset selected</div>
      <div class="coming-soon-body">Upload a .npz file or select a dataset from the list.</div>
    </div>

    <div id="ds-content" style="display:none; flex-direction:column; height:100%; overflow:hidden">
      <!-- Header row -->
      <div id="ds-header" class="ds-header"></div>

      <!-- Split: table (top) + frame detail (bottom) -->
      <div id="ds-body" class="ds-body">
        <!-- Frame table -->
        <div id="ds-table-wrap" class="ds-table-wrap">
          <table id="ds-table" class="ds-table">
            <thead><tr id="ds-thead-row"></tr></thead>
            <tbody id="ds-tbody"></tbody>
          </table>
          <div id="ds-pagination" class="ds-pagination"></div>
        </div>

        <!-- Frame detail panel -->
        <div id="ds-frame-panel" class="ds-frame-panel">
          <div class="ds-frame-panel-hint">Click a row to inspect the frame.</div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Right-click context menu -->
<div id="ctx-menu"></div>

<!-- App scripts -->
<script src="/web/js/api.js"></script>
<script src="/web/js/app.js"></script>

</body>
</html>
